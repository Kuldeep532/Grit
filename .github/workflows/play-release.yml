name: Build Nexus Life Play Bundle

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[play]') || startsWith(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare signing key
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [ -z "$KEYSTORE_FILE" ]; then
            echo "A signing key has not been configured yet."
            exit 1
          fi
          echo "$KEYSTORE_FILE" | base64 -d > "$GITHUB_WORKSPACE/signing-key.jks"

      - name: Apply code formatting
        run: ./gradlew spotlessApply

      - name: Build free Play Store bundle
        run: |
          ./gradlew bundleFossRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/signing-key.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias=nexuslife \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: nexus-life-play-bundle
          path: androidApp/build/outputs/bundle/fossRelease/*.aab
          if-no-files-found: error
          retention-days: 14
